name: Execute notebooks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Execute notebooks (without modifying the working tree)
        run: |
          find notebooks -name '*.ipynb' -print0 | while IFS= read -r -d '' nb; do
            echo "Executing $nb"
            jupyter nbconvert --to notebook --execute --stdout "$nb" > /dev/null
          done
